name: ghcr-pkg-info
on: workflow_dispatch
permissions:
  packages: write
jobs:
  info:
    runs-on: ubuntu-24.04
    steps:
      - name: Registry API probe
        run: |
          set +e
          check_pkg() {
            local name="$1"
            local tok resp
            tok=$(curl -s -u "hermes-carpe...RET" | jq -r '.token // empty')
            echo "--- $name : token-len=${#tok}"
            resp=$(curl -s -w "\nHTTP:%{http_code}" -H "Authorization: Bearer $tok" "https://ghcr.io/v2/hermes-carpe...m/tags/list")
            echo "$resp"
          }
          check_pkg llama-slim-pkg-probe
          check_pkg stonepad-server
