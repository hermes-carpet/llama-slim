# Auto-build the slim llama-server-cuda-slim image whenever upstream
# ggml-org/llama.cpp (master) moves — and only publish it if it PASSES
# test-batch.sh (text-only gate in CI; full text+vision locally on the GPU box).
#
# Published (only on pass):
#   ghcr.io/hermes-carpet/llama-server-cuda-slim:latest
#   ghcr.io/hermes-carpet/llama-server-cuda-slim:<semver>     # mirrors upstream release
#                                                             # (0.4.0, 0.4.1, ...)
#
# Versioning: pure semver, mirroring upstream ggml-org/llama.cpp release tags.
# The build SHA is the master HEAD at publish time; its DISPLAY version is
# resolved via the compare-API (latest upstream v* tag that is an ancestor of
# the build SHA). No hashes or build numbers in tags; `latest` always points
# at the newest publish. Legacy raw-SHA tags from the pre-semver era are
# pruned after each publish.
#
# State: `upstream-sha` + `release-version` in the repo root = last published
# upstream SHA and its resolved semver.

name: auto-rebuild-on-upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Explicit upstream commit to build (default: latest master)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if SHA already published'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  packages: write

concurrency:
  group: auto-rebuild-llama-cuda
  cancel-in-progress: false

env:
  API_UA: hermes-carpet-llama-slim-ci
  REGISTRY_REPO: hermes-carpet/llama-server-cuda-slim

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      build_sha: ${{ steps.check.outputs.build_sha }}
      changed: ${{ steps.check.outputs.changed }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest upstream master SHA
        id: latest
        run: |
          set -euo pipefail
          sha=$(curl -fsSL \
                  -H "Accept: application/vnd.github+json" \
                  -H "User-Agent: $API_UA" \
                  https://api.github.com/repos/ggml-org/llama.cpp/commits/master \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream master: $sha"

      - name: Compare with published SHA
        id: check
        run: |
          set -euo pipefail
          latest="${{ steps.latest.outputs.sha }}"
          explicit="${{ inputs.upstream_sha }}"
          force="${{ inputs.force }}"
          if [ -n "$explicit" ]; then latest="$explicit"; fi
          current=$(cat upstream-sha 2>/dev/null || echo "")
          echo "published_sha=${current:-<none>}"
          echo "candidate_sha=$latest"
          if [ "$latest" = "$current" ] && [ "$force" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "build_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "build_sha=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve display semver (latest upstream v* tag ancestor of build SHA)
        id: version
        run: |
          set -euo pipefail
          sha="${{ steps.check.outputs.build_sha }}"
          # Fast path: already published this SHA -> reuse recorded version.
          if [ -n "$sha" ] && [ "$sha" = "$(cat upstream-sha 2>/dev/null || echo '')" ]; then
            v=$(cat release-version 2>/dev/null || echo "")
            echo "reusing recorded release-version: $v"
            echo "release_version=${v:-0.4.0}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Gather upstream v* tag -> commit pairs.
          python3 - "$sha" <<'PYEOF'
          import json, os, sys, urllib.request

          OUTPUT = os.environ.get("GITHUB_OUTPUT")
          def emit(k, v):
              # Append `k=v` to the GITHUB_OUTPUT file (Actions contract).
              with open(OUTPUT, "a") as f:
                  f.write(f"{k}={v}\n")

          def get(url):
              req = urllib.request.Request(
                  url, headers={"Accept": "application/vnd.github+json",
                                "User-Agent": os.environ.get("API_UA", "llama-slim-ci")})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def ver_key(v):
              parts = v.lstrip("v").split(".")
              while len(parts) < 3:
                  parts.append("0")
              try:
                  return tuple(int(p) for p in parts[:3])
              except ValueError:
                  return (0, 0, 0)

          def ver_max(cands):
              # Highest semver tag name among a list of (name, shortsha) tuples.
              return max(cands, key=lambda c: ver_key(c[0]))[0]

          sha = sys.argv[1]
          tags = []
          for page in (1, 2, 3):
              batch = get(f"https://api.github.com/repos/ggml-org/llama.cpp/tags?per_page=100&page={page}")
              if not isinstance(batch, list) or not batch:
                  break
              tags.extend(batch)
          candidates = []
          for t in tags:
              name = t.get("name", "")
              if not (name.startswith("v") and name[1:2].isdigit()):
                  continue
              c = t.get("commit", {})
              tc = (c.get("sha") or "") if isinstance(c, dict) else "".join(str(x) for x in c)
              if tc:
                  candidates.append((name, tc[:12]))
          print(f"upstream semver tags: {len(candidates)}")
          if not candidates:
              sys.stderr.write("WARN: no upstream release tags found; defaulting to v0.4.0\n")
              emit("release_version", "0.4.0")
              sys.exit(0)

          def ancestor(base, sha):
              # True if base is the same as or an ancestor of sha.
              # compare `<base>...<sha>` (2-dot): status "ahead" => sha newer
              # than base (base is an ancestor); "identical" => same commit.
              d = get(f"https://api.github.com/repos/ggml-org/llama.cpp/compare/{base}...{sha}")
              return d.get("status") in ("ahead", "identical")

          # Pick the highest upstream semver tag that is an ancestor of /
          # identical to the build sha. Deterministic (max by semver), not
          # dependent on the API's tag ordering.
          versions = []
          for name, short in candidates:
              if ancestor(name, sha) or name.removeprefix("v") in sha:
                  versions.append(name)
                  print(f"  ancestor: {name} (tag commit {short})")
          if versions:
              version = max(versions, key=lambda n: ver_key(n))[1:]
              print(f"resolved highest ancestor semver: v{version}")
          else:
              version = ver_max(candidates)[1:]
              print(f"note: no release-tag ancestor; falling back to highest known v{version}")
          emit("release_version", version)
          PYEOF

  build-test-push:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      UPSTREAM_SHA: ${{ needs.check-upstream.outputs.build_sha }}
      RELEASE_VERSION: ${{ needs.check-upstream.outputs.release_version }}
      STAGE_IMG: ghcr.io/hermes-carpet/llama-server-cuda-slim:candidate
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (GitHub runner)
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Fetch upstream llama.cpp at candidate SHA
        run: |
          set -euo pipefail
          mkdir -p upstream && cd upstream
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          echo "checked out $(git rev-parse HEAD)"
          du -sh .

      - name: Stage Dockerfile into build context
        run: |
          set -euo pipefail
          cp Dockerfile .dockerignore entrypoint.sh upstream/
          ls -la upstream | head

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune stale docker state
        run: |
          docker system df
          docker image prune -f || true

      - name: Build slim image
        run: |
          set -euo pipefail
          echo "building display version v${RELEASE_VERSION}"
          docker build \
            --build-arg APP_VERSION="$RELEASE_VERSION" \
            --build-arg APP_REVISION="auto-rebuild @ ${GITHUB_SHA} (upstream ${UPSTREAM_SHA})" \
            -f upstream/Dockerfile \
            -t "$STAGE_IMG" \
            upstream/ \
            | tee build.log
          docker image ls | grep -E "llama-server-cuda-slim|REPOSITORY" || true

      - name: Verify binary in image
        run: |
          set -euo pipefail
          docker create --name cand2 "$STAGE_IMG" true >/dev/null
          docker cp cand2:/app/llama-server /tmp/llama-server-check >/dev/null
          file /tmp/llama-server-check || true
          docker run --rm --entrypoint /app/llama-server "$STAGE_IMG" --version 2>&1 | head -5
          docker rm -f cand2 >/dev/null

      - name: "Download acceptance model (unsloth Qwen3.5-9B UD-Q4_K_XL)"
        run: |
          set -euo pipefail
          # CI text-only gate: just the LLM is needed. mmproj (vision)
          # stays on the GPU box for the full local gate — running the
          # vision path on a 4-core CPU runner times out at ~0.15 tok/s.
          # See README → "Local acceptance gate (full text + vision)".
          mkdir -p /tmp/llama-models
          curl -L --fail --retry 3 -o /tmp/llama-models/Qwen3.5-9B-UD-Q4_K_XL.gguf \
            "https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-UD-Q4_K_XL.gguf"
          sha256sum /tmp/llama-models/*
          df -h /tmp

      - name: "Serve 9B Qwen3.5 (CPU) + run test-batch.sh (text-only sanity)"
        run: |
          set -uo pipefail
          # CI gate = text-only, CPU-runnable (proven to pass in ~2.75 min).
          # It verifies the image boots, all SONAME libs load, the server
          # serves, and the model answers correctly on CPU.
          # The FULL text+vision acceptance gate is run on the GPU box
          # against the PULLED image (README → "Local acceptance gate").
          docker run -d --name cand -p 8090:8080 --shm-size=2g \
            -v /tmp/llama-models:/models \
            "$STAGE_IMG" \
            --model /models/Qwen3.5-9B-UD-Q4_K_XL.gguf \
            --n-gpu-layers 0 \
            --ctx-size 8192 \
            --host 0.0.0.0 --port 8080 \
            >/dev/null

          ( for i in $(seq 1 180); do
              if curl -sf --max-time 2 http://127.0.0.1:8090/health >/dev/null; then
                echo "healthy after ${i} attempts"; break
              fi
              sleep 5
            done )

          # Keep reports in a scratch dir (minimises repo tree writes).
          mkdir -p /tmp/lscuda-test-run
          cp test-batch.sh /tmp/lscuda-test-run/
          if ! (cd /tmp/lscuda-test-run \
                && TIMEOUT=1800 BASE_URL=http://127.0.0.1:8090 SKIP_VISION=true bash test-batch.sh); then
            docker logs cand > /tmp/lscuda-test-run/server.log 2>&1 || true
            echo "---- server log tail ----"
            tail -80 /tmp/lscuda-test-run/server.log || true
            exit 1
          fi

          ls -la /tmp/lscuda-test-run | tail -5

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-report-${{ env.UPSTREAM_SHA }}
          path: |
            build.log
            /tmp/lscuda-test-run/test-report-*.json
            /tmp/lscuda-test-run/server.log
          retention-days: 30
          if-no-files-found: warn

      - name: Push to ghcr.io on PASS
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --- tags (pure semver, no hashes; latest = newest publish) ---
          docker tag "$STAGE_IMG" "ghcr.io/$REGISTRY_REPO:latest"
          docker tag "$STAGE_IMG" "ghcr.io/$REGISTRY_REPO:$RELEASE_VERSION"
          docker push "ghcr.io/$REGISTRY_REPO:latest"
          docker push "ghcr.io/$REGISTRY_REPO:$RELEASE_VERSION"

          # --- prune legacy raw-SHA / one-off tags (pre-semver era) ---
          # Keep: latest + <semver>. Everything else (old upstream-SHA tags,
          # stale cuda-* tags, any probe tags) is deleted, best-effort.
          # NOTE: GHCR has no working distribution-DELETE; the script uses
          # the GitHub REST Packages API (see permissions: block above).
          # Kept non-fatal — the push already succeeded, so a prune hiccup
          # must never fail the run.
          python3 scripts/prune-ghcr-tags.py \
            || echo "WARN: tag prune did not complete (non-fatal)"

          # Clean the local docker state so the next run starts fresh.
          docker system prune -f || true
          echo "published as latest / v${RELEASE_VERSION}"

      - name: Advance upstream-sha + release-version + commit
        if: success()
        run: |
          set -euo pipefail
          echo "$UPSTREAM_SHA" > upstream-sha
          echo "$RELEASE_VERSION" > release-version
          git config user.name  "hermes-carpet"
          git config user.email "hermes-carpet@users.noreply.github.com"
          git add upstream-sha release-version
          if git diff --cached --quiet; then
            echo "state already current (no new commit); nothing to advance"
          else
            git commit -m "auto-rebuild: publish v${RELEASE_VERSION} for upstream $UPSTREAM_SHA"
            # Rebase over any commits that landed during the ~25-min build
            # (e.g. Dependabot / manual pushes) before pushing.
            git pull --rebase origin main
            git push
            echo "pushed new upstream-sha + release-version"
          fi
