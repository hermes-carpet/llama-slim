name: ghcr-write-probe
on: workflow_dispatch
permissions:
  packages: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare orphaned name vs fresh name
        run: |
          set +e
          docker pull hello-world || true
          docker login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN" 2>&1 | tail -1
          echo "=== ORPHANED name (llama-server-cuda-slim) ==="
          docker tag hello-world ghcr.io/hermes-carpe...m':probe-orphan
          docker push ghcr.io/hermes-carpe...m':probe-orphan
          echo "orphan_push_exit=$?"
          echo "============================================="
          echo "=== FRESH name (llm-slim-probe) ==="
          docker tag hello-world ghcr.io/hermes-carpe...m':probe-fresh
          docker push ghcr.io/hermes-carpe...m':probe-fresh
          echo "fresh_push_exit=$?"
