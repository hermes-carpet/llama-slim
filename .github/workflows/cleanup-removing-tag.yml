name: cleanup-removing-tag

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      actions: read
    steps:
      - name: Drop stray cuda-13.3 tag via REST Packages API
        # GITHUB_TOKEN is auto-injected by GitHub Actions with read+write for the repo.
        run: |
          set -uo pipefail
          hdr=()
          hdr+=(-H)
          hdr+=("Authorization: Bearer ***")
          hdr+=(-H)
          hdr+=("Accept: application/vnd.github+json")
          AUTH="curl -s ${hdr[*]} https://api.github.com"
          PKG_JSON=$(bash -c "$AUTH/user/packages?package_type=CONTAINER&per_page=100")
          echo "packages: $(echo "$PKG_JSON" | jq -r '.[].name' | tr '\n' ' ')"
          VJSON=$(bash -c "$AUTH/user/packages/container/llama-server-cuda-slim/versions?per_page=100")
          echo "$VJSON" | jq -c '.[] | {id, tags:[.versions[].name]}'
          VID=$(echo "$VJSON" | jq -r '.[] | select(.versions[].name=="cuda-13.3") | .id' | sort -u)
          if [ -n "$VID" ]; then
            for v in $VID; do
              RESP=$(bash -c "$AUTH -o /tmp/del.json -w %{http_code} -X DELETE /user/packages/container/llama-server-cuda-slim/versions/$v")
              echo "delete v=$v -> $RESP"; cat /tmp/del.json 2>/dev/null; echo
            done
          else
            echo "cuda-13.3 tag: not found (already cleaned?)"
          fi
