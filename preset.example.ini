[*]
; Global defaults applied to every model in this preset.
; Any key here may be overridden per-model in a named section below, or at
; runtime via a CLI flag / env var (CLI > preset).
;
; This INI is the Ollama-Modelfile analogue: one file, many models, each with
; its own params. Serve it with:
;   llama-server-run --models-preset /etc/llama/presets.ini --models-max 1
; Request a specific model by its section name via the API's "model" field:
;   {"model": "Qwen3.5-9B", "messages": [...]}
; --models-max 1 = keep at most 1 model resident (clears the previous model's
; VRAM before loading the requested one = model swap).

mmap          = 1
kv-unified    = 1
n-gpu-layers  = 99
flash-attn    = on
jinja         = 1
; sleep after 300s (5 min) idle to free VRAM/RAM; -1 = never sleep
sleep-idle-seconds = 300
; quantized KV cache (works because the bundle is built with
; GGML_CUDA_FA_ALL_QUANTS=ON so FA covers these quant types):
cache-type-k  = q8_0
cache-type-v  = q8_0

[Qwen3.5-9B]
hf        = unsloth/Qwen3.5-9B-GGUF:Q4_K_M
ctx-size  = 131072
temp      = 0.6
top-k     = 20
top-p     = 0.95
reasoning = on

[gpt-oss-20b-hf]
hf                         = ggml-org/gpt-oss-20b-hf
ctx-size                   = 65536
temp                       = 1.0
top-k                      = 0
top-p                      = 1.0
min-p                      = 0.01
chat-template-kwargs    = {"reasoning_effort": "high"}
